<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#eef4f9" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Connection unavailable | YITA Iceberg</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        background: #eef4f9;
        color: #0b1d36;
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100dvh;
        padding:
          calc(24px + env(safe-area-inset-top))
          24px
          calc(24px + env(safe-area-inset-bottom));
      }

      main {
        max-width: 420px;
        text-align: center;
        width: 100%;
      }

      img {
        display: block;
        height: 112px;
        margin: 0 auto 28px;
        width: 112px;
      }

      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 36px;
        font-weight: 500;
        letter-spacing: 0;
        line-height: 1.08;
        margin: 0;
      }

      p {
        color: #526174;
        font-size: 16px;
        line-height: 1.65;
        margin: 18px auto 0;
        max-width: 360px;
      }

      a {
        align-items: center;
        background: #0b2d55;
        border-radius: 8px;
        color: #fff;
        display: inline-flex;
        font-size: 15px;
        font-weight: 700;
        justify-content: center;
        margin-top: 28px;
        min-height: 48px;
        padding: 0 24px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img
        alt="YITA Iceberg"
        height="112"
        src="/icons/yita-iceberg-maskable-512x512.png"
        width="112"
      />
      <h1>Connection unavailable</h1>
      <p>
        YITA Iceberg requires a live connection before showing inventory,
        orders, payments, or reports. Reconnect to continue with current data.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
